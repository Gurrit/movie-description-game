services:
  frontend:
    build:
      context: app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - "./app/src:/usr/src/app/src"
      - "./app/public:/usr/src/app/public"
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: moviegame
      POSTGRES_USER: moviegame
      POSTGRES_PASSWORD: moviegame
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviegame -d moviegame"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
