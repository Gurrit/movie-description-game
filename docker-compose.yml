services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: moviegame
      POSTGRES_USER: moviegame
      POSTGRES_PASSWORD: moviegame
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviegame -d moviegame"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
