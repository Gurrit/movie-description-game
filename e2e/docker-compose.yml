# The whole stack for end-to-end tests: real Postgres, backend and web image, with a fake TMDB.
# Separate ports and project name from the development compose file, so both can run at once.
name: mdg-e2e
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: moviegame
      POSTGRES_USER: moviegame
      POSTGRES_PASSWORD: moviegame
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviegame -d moviegame"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-tmdb:
    image: node:22-alpine
    command: ["node", "/app/fake-tmdb.mjs"]
    volumes:
      - ./fake-tmdb.mjs:/app/fake-tmdb.mjs:ro
    ports:
      - "8089:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/moviegame
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/moviegame
      TMDB_BASE_URL: http://fake-tmdb:3000/3
      TMDB_READ_TOKEN: e2e-token
      INTERNAL_TOKEN: e2e-internal
      # A short game keeps the tests quick
      GAME_ROUNDSPERGAME: "3"
      GAME_ATTEMPTSPERROUND: "2"
    depends_on:
      postgres:
        condition: service_healthy
      fake-tmdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz/readiness >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
      args:
        # Posters come from the fake TMDB, which the browser reaches on the host port
        VITE_TMDB_IMAGE_BASE: http://localhost:8089/images
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/healthz/readiness >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
